name: Bug report
description: A tool script, core script, schema, or document behaves incorrectly.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail that someone can reproduce the behavior in their own tenant.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Tool script (scripts/tool_*.py)
        - Core script (replay_log.py, consolidate_run.py, generate_html_report.py, identity.py, …)
        - Schema (replay-log / finding-triage / finding-to-control / roe-consent)
        - Documentation (README, ADR, technique module, guardrails)
        - Other (explain below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA you're running (Rejewski is pre-release; there are no tagged versions yet).
      placeholder: main @ <commit-sha>
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include the exact command line if it's a script issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error output verbatim. Redact tenant IDs, object IDs, and user principal names.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Python version, key package versions (msal, requests, jsonschema), OS.
      placeholder: |
        Python: 3.11.9
        msal: 1.28.0
        OS: Windows 11 23H2
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I verified the issue on the latest release (or `main`).
          required: true
        - label: I redacted tenant-specific identifiers from logs and screenshots.
          required: true